<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1b5e20" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gantt Salvadent" />
  <title>Gantt — Salvadent Smart Manager</title>
  <style>
    :root { --verde:#1b5e20; --label-w:140px; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:#f4f6f4; color:#222; }
    header {
      position:sticky; top:0; z-index:20; background:var(--verde); color:#fff;
      padding:10px 14px; display:flex; align-items:center; gap:10px;
      box-shadow:0 2px 6px rgba(0,0,0,.15);
    }
    header h1 { font-size:16px; margin:0; flex:1; font-weight:600; }
    header .meta { font-size:11px; opacity:.85; }
    header button {
      border:none; background:rgba(255,255,255,.18); color:#fff;
      border-radius:14px; padding:5px 10px; font-size:13px;
    }
    #status { padding:16px; text-align:center; color:#777; font-size:14px; }

    .scroll { overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; background:#fff; }
    .gantt { position:relative; width:max-content; min-width:100%; }

    /* Header axa */
    .axis-row { display:flex; position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid #d9d9d9; }
    .axis-row .corner {
      position:sticky; left:0; z-index:11; width:var(--label-w); min-width:var(--label-w);
      background:#fff; border-right:1px solid #ddd;
    }
    .axis { position:relative; height:100%; }
    .tier { position:relative; }
    .tier.months { height:24px; }
    .tier.weeks { height:20px; border-top:1px solid #eee; }
    .cell {
      position:absolute; top:0; bottom:0; border-left:1px solid #ececec;
      font-size:11px; color:#555; display:flex; align-items:center; padding-left:4px; overflow:hidden; white-space:nowrap;
    }
    .cell.b { background:rgba(0,0,0,.05); }
    .tier.months .cell { font-weight:600; color:#333; }

    /* Benzi alternante alb / gri deschis pe coloane */
    .stripe { position:absolute; top:0; bottom:0; z-index:0; }
    .stripe.b { background:rgba(0,0,0,.05); }

    /* Randuri */
    .row { display:flex; min-height:36px; align-items:stretch; border-bottom:1px solid #f0f0f0; background:#fff; }
    .row.stage { background:#fafbfa; }
    .label {
      position:sticky; left:0; z-index:5; width:var(--label-w); min-width:var(--label-w);
      background:inherit; padding:5px 6px; display:flex; align-items:center; gap:5px;
      border-right:1px solid #ddd; font-size:12.5px;
    }
    .row.stage .label { background:#fafbfa; }
    .toggle {
      border:none; background:#eef2ee; color:var(--verde); width:20px; min-width:20px; height:20px;
      border-radius:5px; font-size:11px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .pname { font-weight:600; white-space:normal; line-height:1.25; word-break:break-word; }
    .sname { color:#444; white-space:normal; line-height:1.25; word-break:break-word; padding-left:22px; }
    .lane { position:relative; flex:0 0 auto; }
    .bar {
      position:absolute; top:50%; transform:translateY(-50%); height:20px; border-radius:5px; color:#fff;
      font-size:11px; line-height:20px; padding:0 6px; overflow:hidden; white-space:nowrap;
      box-shadow:0 1px 2px rgba(0,0,0,.2); z-index:2;
    }
    .bar.project { background:var(--verde); }
    .today { position:absolute; top:0; bottom:0; width:2px; background:#e53935; opacity:.6; z-index:3; }

    .r0 { background:#1b5e20; } .r1 { background:#1565c0; } .r2 { background:#c62828; }
    .r3 { background:#ef6c00; } .r4 { background:#6a1b9a; } .r5 { background:#00838f; }

    /* KPI pe persoana */
    .kpi-pers { background:#fff; margin:14px; border-radius:12px; padding:14px 16px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
    .kpi-pers h2 { font-size:15px; margin:0 0 4px; color:var(--verde); }
    .kpi-pers .hint { font-size:11.5px; color:#888; margin:0 0 12px; }
    .kpi-pers .persoana { display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:7px 0; border-top:1px solid #f0f0f0; }
    .kpi-pers .persoana:first-of-type { border-top:none; }
    .kpi-pers .nume { font-weight:600; font-size:13.5px; min-width:90px; }
    .kpi-pers .chip { font-size:12px; padding:2px 8px; border-radius:11px; background:#f1f3f1; color:#333; white-space:nowrap; }
    .kpi-pers .chip b { font-weight:700; }
    .kpi-pers .chip.v { background:#e6f4ea; color:#1b5e20; }
    .kpi-pers .chip.g { background:#fef7e0; color:#9a6b00; }
    .kpi-pers .chip.r { background:#fce8e6; color:#c62828; }
    .kpi-pers .gol { font-size:12.5px; color:#999; }
  </style>
</head>
<body>
  <header>
    <h1>📊 Gantt Salvadent</h1>
    <button id="collapseAll">Restrânge tot</button>
    <span class="meta" id="updated">…</span>
  </header>

  <div id="status">Se încarcă…</div>
  <div class="scroll" id="scroll"><div class="gantt" id="gantt"></div></div>

  <section class="kpi-pers" id="kpiPersoane" style="display:none">
    <h2>KPI pe persoană</h2>
    <p class="hint">Execuție lunară = taskuri făcute / planificate, pentru fiecare persoană implicată în proiecte.</p>
    <div id="kpiPersBody"></div>
  </section>

  <script>
    const SPREADSHEET_ID = "1Yz-4yie7FFvST3LNTadoqpVZdexsXYQNK9r0BHsXq_E";
    const SHEET_NAME = "gantt";
    const REFRESH_MS = 60000;
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
    const BIFAJE_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=bifaje`;
    let taskResp = {}; // "Proiect|Etapa" -> "Responsabil" (din gantt)

    const LUNI = ["Ian","Feb","Mar","Apr","Mai","Iun","Iul","Aug","Sep","Oct","Noi","Dec"];
    const DAY = 86400000;
    const YEAR = new Date().getFullYear();
    const yearStart = new Date(YEAR, 0, 1);
    const yearEnd = new Date(YEAR, 11, 31);
    const totalDays = Math.round((yearEnd - yearStart) / DAY) + 1;

    let projects = [];
    let expanded = new Set();
    let firstLoad = true;

    // ---------- CSV ----------
    function parseCSV(text) {
      const rows = []; let row = [], cur = "", q = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (q) {
          if (c === '"' && text[i+1] === '"') { cur += '"'; i++; }
          else if (c === '"') q = false;
          else cur += c;
        } else {
          if (c === '"') q = true;
          else if (c === ",") { row.push(cur); cur = ""; }
          else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
          else if (c !== "\r") cur += c;
        }
      }
      if (cur.length || row.length) { row.push(cur); rows.push(row); }
      return rows;
    }
    function pd(s) { const p = (s||"").trim().split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
    function dayIdx(d) { return Math.round((d - yearStart) / DAY); }

    function buildProjects(rows) {
      const map = new Map(); const respMap = {}; taskResp = {};
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r[0] || !r[1] || !r[3] || !r[4]) continue;
        const name = r[0].trim();
        if (!map.has(name)) map.set(name, { name, stages: [], start: null, end: null });
        const p = map.get(name);
        const start = pd(r[3]), end = pd(r[4]);
        const resp = (r[2]||"—").trim();
        if (!(resp in respMap)) respMap[resp] = "r" + (Object.keys(respMap).length % 6);
        p.stages.push({ etapa: r[1].trim(), resp, start, end, cls: respMap[resp] });
        taskResp[name + "|" + r[1].trim()] = resp;
        if (!p.start || start < p.start) p.start = start;
        if (!p.end || end > p.end) p.end = end;
      }
      return [...map.values()];
    }

    // ---------- Randare ----------
    function pxPerDay() {
      const avail = (window.innerWidth || 360) - parseInt(getComputedStyle(document.documentElement).getPropertyValue("--label-w"));
      const monthPx = Math.max(2.0, avail / totalDays); // luna incape pe ecran
      return expanded.size ? Math.max(monthPx * 4, 11) : monthPx; // saptamani = mai larg
    }

    function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

    // Lista coloanelor (luni in overview, saptamani in extins) cu paritate b=1/0
    function columnRanges(ppd) {
      const out = [];
      if (expanded.size) {
        let d = new Date(yearStart);
        const off = (d.getDay() + 6) % 7; // 0=luni
        d = new Date(d.getTime() - off*DAY);
        let k = 0;
        while (d <= yearEnd) {
          const left = Math.max(0, dayIdx(d));
          const right = Math.min(totalDays, dayIdx(d) + 7);
          if (right > 0 && left < totalDays) out.push({ left:left*ppd, width:(right-left)*ppd, b:k%2, label:String(d.getDate()) });
          d = new Date(d.getTime() + 7*DAY); k++;
        }
      } else {
        for (let m = 0; m < 12; m++) {
          const s = dayIdx(new Date(YEAR, m, 1));
          const w = new Date(YEAR, m+1, 0).getDate();
          out.push({ left:s*ppd, width:w*ppd, b:m%2, label:LUNI[m] });
        }
      }
      return out;
    }
    function monthCells(ppd) {
      const frag = document.createDocumentFragment();
      for (let m = 0; m < 12; m++) {
        const s = dayIdx(new Date(YEAR, m, 1));
        const w = new Date(YEAR, m+1, 0).getDate();
        const c = el("div", "cell" + (m%2 ? " b" : ""), LUNI[m]);
        c.style.left = (s*ppd) + "px"; c.style.width = (w*ppd) + "px";
        frag.appendChild(c);
      }
      return frag;
    }
    function weekCells(ppd) {
      const frag = document.createDocumentFragment();
      columnRanges(ppd).forEach(function (c) {
        const cell = el("div", "cell" + (c.b ? " b" : ""), c.label);
        cell.style.left = c.left + "px"; cell.style.width = c.width + "px";
        frag.appendChild(cell);
      });
      return frag;
    }
    function stripesFrag(ppd) {
      const frag = document.createDocumentFragment();
      columnRanges(ppd).forEach(function (c) {
        if (!c.b) return; // doar coloanele gri; restul raman albe
        const s = el("div", "stripe b");
        s.style.left = c.left + "px"; s.style.width = c.width + "px";
        frag.appendChild(s);
      });
      return frag;
    }

    function render(focusNow) {
      const ppd = pxPerDay();
      const timelineW = totalDays * ppd;
      const g = document.getElementById("gantt");
      g.innerHTML = "";

      // --- Axa ---
      const axisRow = el("div", "axis-row");
      axisRow.appendChild(el("div", "corner"));
      const axis = el("div", "axis"); axis.style.width = timelineW + "px";
      const months = el("div", "tier months"); months.style.width = timelineW + "px"; months.appendChild(monthCells(ppd));
      axis.appendChild(months);
      if (expanded.size) {
        const weeks = el("div", "tier weeks"); weeks.style.width = timelineW + "px"; weeks.appendChild(weekCells(ppd));
        axis.appendChild(weeks);
      }
      axisRow.appendChild(axis);
      g.appendChild(axisRow);

      // linia "azi"
      const today = new Date(); today.setHours(0,0,0,0);
      const tIdx = dayIdx(today);
      const showToday = tIdx >= 0 && tIdx < totalDays;

      // --- Randuri ---
      projects.forEach(function (p) {
        const isOpen = expanded.has(p.name);
        const row = el("div", "row");
        const label = el("div", "label");
        const tg = el("button", "toggle", isOpen ? "▼" : "▶");
        tg.addEventListener("click", function () {
          if (expanded.has(p.name)) expanded.delete(p.name); else expanded.add(p.name);
          render(true);
        });
        label.appendChild(tg);
        label.appendChild(el("span", "pname", p.name));
        row.appendChild(label);

        const lane = el("div", "lane"); lane.style.width = timelineW + "px";
        lane.appendChild(stripesFrag(ppd));
        if (showToday) { const tl = el("div","today"); tl.style.left = (tIdx*ppd + ppd/2) + "px"; lane.appendChild(tl); }
        const bar = el("div", "bar project");
        const l = dayIdx(p.start), r = dayIdx(p.end);
        bar.style.left = (l*ppd) + "px"; bar.style.width = ((r-l+1)*ppd) + "px";
        if (!expanded.size) bar.textContent = p.name;
        lane.appendChild(bar);
        row.appendChild(lane);
        g.appendChild(row);

        if (isOpen) {
          p.stages.forEach(function (s) {
            const sr = el("div", "row stage");
            const sl = el("div", "label");
            sl.appendChild(el("span", "sname", s.etapa + (s.resp ? " · " + s.resp : "")));
            sr.appendChild(sl);
            const slane = el("div", "lane"); slane.style.width = timelineW + "px";
            slane.appendChild(stripesFrag(ppd));
            if (showToday) { const tl = el("div","today"); tl.style.left = (tIdx*ppd + ppd/2) + "px"; slane.appendChild(tl); }
            const sb = el("div", "bar " + s.cls);
            const sl2 = dayIdx(s.start), sr2 = dayIdx(s.end);
            sb.style.left = (sl2*ppd) + "px"; sb.style.width = ((sr2-sl2+1)*ppd) + "px";
            sb.textContent = s.etapa;
            slane.appendChild(sb);
            sr.appendChild(slane);
            g.appendChild(sr);
          });
        }
      });

      // auto-scroll pe luna curenta (la deschidere si la toggle, nu la refresh)
      if (focusNow) {
        const lunaCurenta = new Date(YEAR, today.getMonth(), 1);
        document.getElementById("scroll").scrollLeft = Math.max(0, dayIdx(lunaCurenta)*ppd - 8);
      }
    }

    // ---------- KPI pe persoana ----------
    function pct(n) { return Math.round(n * 100); }
    function clasaPct(p) { return p >= 85 ? "v" : (p >= 70 ? "g" : "r"); }
    function numePersoane(resp) {
      return (resp || "").split(/[,/]/).map(function (s) { return s.trim(); })
        .filter(function (s) { return s && s !== "—" && s !== "-"; });
    }
    function etichetaLuna(luna) { const p = luna.split("-"); return LUNI[(+p[1]) - 1]; }

    async function loadKpiPersoane() {
      try {
        const res = await fetch(BIFAJE_URL + "&_=" + Date.now());
        const rows = parseCSV(await res.text());
        const acc = {}; const luniSet = new Set();
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          const data = (r[0] || "").trim();        // A Data
          if (!data) continue;
          if ((r[7] || "").trim() !== "1") continue; // H Planificat
          const proiect = (r[2] || "").trim();     // C
          const task = (r[3] || "").trim();        // D
          const facut = (r[8] || "").trim();       // I Facut
          const luna = data.slice(0, 7);
          luniSet.add(luna);
          numePersoane(taskResp[proiect + "|" + task] || "").forEach(function (nume) {
            acc[nume] = acc[nume] || {};
            acc[nume][luna] = acc[nume][luna] || { plan: 0, facut: 0 };
            acc[nume][luna].plan++;
            if (facut === "1") acc[nume][luna].facut++;
          });
        }
        randeazaKpiPersoane(acc, [...luniSet].sort());
      } catch (e) { /* silentios */ }
    }

    function randeazaKpiPersoane(acc, luni) {
      const sect = document.getElementById("kpiPersoane");
      const body = document.getElementById("kpiPersBody");
      const nume = Object.keys(acc).sort(function (a, b) {
        if (a === "Cosmin") return -1; if (b === "Cosmin") return 1; return a.localeCompare(b, "ro");
      });
      sect.style.display = "block"; body.innerHTML = "";
      if (!nume.length) { body.innerHTML = '<div class="gol">Încă fără date — KPI-urile apar pe măsură ce bifezi zilele.</div>'; return; }
      nume.forEach(function (n) {
        const row = el("div", "persoana");
        row.appendChild(el("span", "nume", n + ":"));
        luni.forEach(function (luna) {
          const d = acc[n][luna]; if (!d) return;
          const p = pct(d.facut / d.plan);
          row.appendChild(el("span", "chip " + clasaPct(p), etichetaLuna(luna) + " <b>" + p + "%</b>"));
        });
        body.appendChild(row);
      });
    }

    async function load() {
      try {
        const res = await fetch(GVIZ_URL + "&_=" + Date.now());
        const rows = parseCSV(await res.text());
        projects = buildProjects(rows);
        document.getElementById("status").style.display = projects.length ? "none" : "block";
        if (!projects.length) { document.getElementById("status").textContent = "Niciun proiect încă."; return; }
        render(firstLoad);
        firstLoad = false;
        loadKpiPersoane();
        const now = new Date();
        document.getElementById("updated").textContent = "act. " + now.toLocaleTimeString("ro-RO", {hour:"2-digit", minute:"2-digit"});
      } catch (e) {
        document.getElementById("status").style.display = "block";
        document.getElementById("status").textContent = "Eroare la încărcare: " + e.message;
      }
    }

    document.getElementById("collapseAll").addEventListener("click", function () { expanded.clear(); render(true); });
    window.addEventListener("resize", function () { if (projects.length) render(false); });
    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
