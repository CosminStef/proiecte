<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1b5e20" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gantt Salvadent" />
  <title>Gantt — Salvadent Smart Manager</title>

  <!-- frappe-gantt (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css" />
  <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>

  <style>
    :root { --verde: #1b5e20; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f4; color: #222;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: var(--verde); color: #fff;
      padding: 10px 14px; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
    }
    header h1 { font-size: 16px; margin: 0; flex: 1; font-weight: 600; }
    header .meta { font-size: 11px; opacity: .85; }
    .controls {
      display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto;
      background: #fff; border-bottom: 1px solid #e0e0e0;
    }
    .controls button {
      border: 1px solid #cdd6cd; background: #fff; color: #333;
      border-radius: 16px; padding: 5px 12px; font-size: 13px; white-space: nowrap;
    }
    .controls button.active { background: var(--verde); color: #fff; border-color: var(--verde); }
    #gantt-wrap { overflow-x: auto; padding: 8px 0 40px; }
    #status { padding: 16px; text-align: center; color: #777; font-size: 14px; }

    /* Culori per responsabil (clase aplicate dinamic) */
    .bar-r0 .bar { fill: #1b5e20; } .bar-r0 .bar-progress { fill: #2e7d32; }
    .bar-r1 .bar { fill: #1565c0; } .bar-r1 .bar-progress { fill: #1976d2; }
    .bar-r2 .bar { fill: #c62828; } .bar-r2 .bar-progress { fill: #e53935; }
    .bar-r3 .bar { fill: #ef6c00; } .bar-r3 .bar-progress { fill: #fb8c00; }
    .bar-r4 .bar { fill: #6a1b9a; } .bar-r4 .bar-progress { fill: #8e24aa; }
    .bar-r5 .bar { fill: #00838f; } .bar-r5 .bar-progress { fill: #00acc1; }
  </style>
</head>
<body>
  <header>
    <h1>📊 Gantt Salvadent</h1>
    <span class="meta" id="updated">…</span>
  </header>

  <div class="controls">
    <button data-mode="Quarter Day">Oră</button>
    <button data-mode="Day">Zi</button>
    <button data-mode="Week" class="active">Săptămână</button>
    <button data-mode="Month">Lună</button>
    <button id="refresh">↻</button>
  </div>

  <div id="status">Se încarcă…</div>
  <div id="gantt-wrap"><svg id="gantt"></svg></div>

  <script>
    // === CONFIG: completeaza ID-ul spreadsheet-ului dupa publicare ===
    const SPREADSHEET_ID = "1Yz-4yie7FFvST3LNTadoqpVZdexsXYQNK9r0BHsXq_E";
    const SHEET_NAME = "gantt";
    const REFRESH_MS = 60000; // reimprospatare automata la 60s

    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

    let viewMode = "Week";
    let gantt = null;

    // --- CSV parser minimal (gestioneaza ghilimele) ---
    function parseCSV(text) {
      const rows = []; let row = []; let cur = ""; let q = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (q) {
          if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
          else if (c === '"') { q = false; }
          else cur += c;
        } else {
          if (c === '"') q = true;
          else if (c === ",") { row.push(cur); cur = ""; }
          else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
          else if (c === "\r") { /* skip */ }
          else cur += c;
        }
      }
      if (cur.length || row.length) { row.push(cur); rows.push(row); }
      return rows;
    }

    function respClass(resp, map) {
      if (!(resp in map)) map[resp] = "bar-r" + (Object.keys(map).length % 6);
      return map[resp];
    }

    function buildTasks(rows) {
      // header: Proiect, Etapa, Responsabil, Start, Sfarsit, Durata, Dependinta, Progres
      const tasks = []; const respMap = {}; const nameToId = {};
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r[1] || !r[3] || !r[4]) continue; // nevoie de etapa, start, sfarsit
        const id = "t" + i;
        nameToId[(r[0] || "") + "::" + r[1]] = id;
      }
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r[1] || !r[3] || !r[4]) continue;
        const proiect = r[0] || "";
        const dep = r[6] ? (nameToId[proiect + "::" + r[6]] || "") : "";
        tasks.push({
          id: "t" + i,
          name: (proiect ? proiect + " · " : "") + r[1] + (r[2] ? " (" + r[2] + ")" : ""),
          start: r[3].trim(),
          end: r[4].trim(),
          progress: Number(r[7]) || 0,
          dependencies: dep,
          custom_class: respClass(r[2] || "—", respMap)
        });
      }
      return tasks;
    }

    function render(tasks) {
      document.getElementById("status").style.display = tasks.length ? "none" : "block";
      if (!tasks.length) { document.getElementById("status").textContent = "Niciun proiect încă."; return; }
      document.getElementById("gantt").innerHTML = "";
      gantt = new Gantt("#gantt", tasks, {
        view_mode: viewMode,
        language: "en",
        bar_height: 22,
        padding: 16,
        custom_popup_html: function (t) {
          return `<div style="padding:8px 10px;font-size:13px">
            <b>${t.name}</b><br>${t.start} → ${t.end}<br>Progres: ${t._progress || t.progress}%</div>`;
        }
      });
    }

    async function load() {
      try {
        const res = await fetch(GVIZ_URL + "&_=" + Date.now());
        const txt = await res.text();
        const rows = parseCSV(txt);
        render(buildTasks(rows));
        const now = new Date();
        document.getElementById("updated").textContent =
          "act. " + now.toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit" });
      } catch (e) {
        document.getElementById("status").style.display = "block";
        document.getElementById("status").textContent = "Eroare la încărcare: " + e.message;
      }
    }

    // Butoane view mode
    document.querySelectorAll(".controls button[data-mode]").forEach(function (b) {
      b.addEventListener("click", function () {
        document.querySelectorAll(".controls button[data-mode]").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        viewMode = b.dataset.mode;
        if (gantt) gantt.change_view_mode(viewMode);
      });
    });
    document.getElementById("refresh").addEventListener("click", load);

    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
